<!doctype html>
<!--
  Frame-driven version of the site's hero interaction, for recording the README
  GIF. Every frame is set explicitly by setFrame(n) rather than by a CSS
  transition, so a headless capture gets exactly the same frames every run.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#111113; --bg-elevated:#1b1b1e; --hairline:#2c2c31; --text:#ececec; --muted:#9c9ca3; --accent:#5ea1ff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#08080a; font-family:"Segoe UI",system-ui,sans-serif; }

  .stage {
    position: relative; width: 760px; height: 400px;
    background:
      radial-gradient(900px 380px at 50% -10%, rgba(94,161,255,0.10), transparent 70%),
      linear-gradient(180deg, #111113 0%, #0c0c0e 100%);
    overflow: hidden;
  }

  /* the screen edge the bar docks to */
  .edge { position:absolute; inset:0 0 auto 0; height:2px; background:linear-gradient(90deg,transparent,var(--hairline) 15%,var(--hairline) 85%,transparent); }

  .pill {
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:150px; height:13px; border-radius:0 0 9px 9px;
    background:var(--bg-elevated); border:1px solid var(--hairline); border-top:0;
    box-shadow:0 6px 20px rgba(0,0,0,0.55); z-index:3;
  }
  .pill i { position:absolute; left:50%; top:5px; transform:translateX(-50%); width:40px; height:3px; border-radius:2px; background:var(--accent); opacity:.85; display:block; }

  /* the card unrolls downward like a shade: height is set per frame */
  .shade { position:absolute; top:12px; left:50%; transform:translateX(-50%); width:640px; overflow:hidden; z-index:2; border-radius:0 0 14px 14px; }
  .shade img { display:block; width:640px; height:300px; border-radius:0 0 14px 14px; box-shadow:0 22px 48px rgba(0,0,0,0.6); }

  .cursor { position:absolute; width:18px; height:18px; z-index:5; pointer-events:none; filter:drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
  .cursor svg { display:block; }

  /* a soft ring where a click lands */
  .tap { position:absolute; z-index:4; border:2px solid var(--accent); border-radius:999px; opacity:0; }

  .caption {
    position:absolute; left:0; right:0; bottom:18px; text-align:center;
    font-size:15px; color:var(--muted); letter-spacing:.01em;
  }
  .caption b { color:var(--text); font-weight:600; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="edge"></div>
  <div class="shade" id="shade"><img id="shot" src="shots/04_claude.png" alt=""></div>
  <div class="pill"><i></i></div>
  <div class="tap" id="tap"></div>
  <div class="cursor" id="cursor">
    <svg viewBox="0 0 12 18" width="18" height="26"><path d="M1 1l10 9.5H6.2l2.6 5.6-2.2 1-2.6-5.7L1 14.6V1z" fill="#fff" stroke="#000" stroke-width="1"/></svg>
  </div>
  <p class="caption" id="caption"></p>
</div>

<script>
// One entry per frame: how far the shade is unrolled, which shot, where the
// cursor is, whether a tap ring shows, and the caption. Hold frames repeat.
const SHOTS = {
  claude: 'shots/04_claude.png',
  ports:  'shots/05_ports.png',
  clip:   'shots/03_clipboard.png',
  jarvis: 'shots/09_jarvis.png',
};
const F = [];
const push = (n, o) => { for (let i = 0; i < n; i++) F.push(o); };
const lerp = (a, b, t) => a + (b - a) * t;

// approach: cursor comes up to the pill, bar still shut
for (let i = 0; i < 6; i++) push(1, { h: 0, shot: 'claude', cx: lerp(520, 388, i / 5), cy: lerp(300, 26, i / 5), cap: '' });
// unroll
for (let i = 0; i <= 5; i++) push(1, { h: Math.round(300 * Math.pow(i / 5, 0.65)), shot: 'claude', cx: 388, cy: 26, cap: '' });
// Claude sessions, held
push(7, { h: 300, shot: 'claude', cx: 388, cy: 30, cap: 'Which Claude Code sessions are <b>waiting on you</b>' });
// move to Ports
push(2, { h: 300, shot: 'ports', cx: 330, cy: 120, cap: '' });
push(4, { h: 300, shot: 'ports', cx: 300, cy: 150, cap: 'Every listening port, with the process holding it' });
// click kill on :5173, the stuck dev server
push(2, { h: 300, shot: 'ports', cx: 560, cy: 200, cap: 'One click to <b>kill the stuck dev server</b>' });
push(2, { h: 300, shot: 'ports', cx: 648, cy: 220, tap: [648, 220], cap: 'One click to <b>kill the stuck dev server</b>' });
push(4, { h: 300, shot: 'ports', cx: 648, cy: 220, cap: 'One click to <b>kill the stuck dev server</b>' });
// clipboard
push(5, { h: 300, shot: 'clip', cx: 300, cy: 120, cap: 'Your last 25 copies, tagged' });
// jarvis
push(5, { h: 300, shot: 'jarvis', cx: 300, cy: 120, cap: 'Or press a key and <b>ask Jarvis</b>' });
// look away, collapse
for (let i = 5; i >= 0; i--) push(1, { h: Math.round(300 * Math.pow(i / 5, 0.65)), shot: 'jarvis', cx: lerp(388, 660, (5 - i) / 5), cy: lerp(26, 260, (5 - i) / 5), cap: '' });
// gone
push(6, { h: 0, shot: 'jarvis', cx: 700, cy: 320, cap: 'Look away and it&rsquo;s gone.' });

window.FRAME_COUNT = F.length;
window.setFrame = function (n) {
  const f = F[Math.max(0, Math.min(F.length - 1, n))];
  document.getElementById('shade').style.height = f.h + 'px';
  document.getElementById('shot').src = SHOTS[f.shot];
  const c = document.getElementById('cursor');
  c.style.left = f.cx + 'px';
  c.style.top = f.cy + 'px';
  c.style.opacity = f.cy > 380 ? 0 : 1;
  const tap = document.getElementById('tap');
  if (f.tap) {
    tap.style.left = (f.tap[0] - 18) + 'px'; tap.style.top = (f.tap[1] - 18) + 'px';
    tap.style.width = '36px'; tap.style.height = '36px'; tap.style.opacity = 0.9;
  } else { tap.style.opacity = 0; }
  document.getElementById('caption').innerHTML = f.cap || '';
  return f.h;
};
window.setFrame(0);
</script>
</body>
</html>
